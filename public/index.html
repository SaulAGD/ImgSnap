<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Comprime y optimiza imágenes por lotes sin perder calidad visual. Soporta JPG, PNG y WebP. Procesado local con Sharp & Node.js."/>

    <title>ImgSnap - Compresor de Imágenes</title>
    <link rel="icon" href="/image/imgsnap.svg" type="image/svg+xml" />


    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl md:max-w-3xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 md:p-12 border border-gray-100">
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <div class="flex items-center justify-center gap-3">
                <img src="/image/imgsnap.svg" alt="Logo de ImgSnap" class="h-12 w-12 md:h-16 md:w-16 rounded-xl shadow-sm" />
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 tracking-tight">ImgSnap</h1>
            </div>
            <p class="text-gray-500 text-sm mt-1">Comprime y optimiza imágenes por lotes sin perder calidad visual </p>
        </div>

        <!-- Mensajes de alerta / error -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200"></div>

        <!-- Zona de Drag & Drop -->
        <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all">
            <div class="pointer-events-none">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <p class="text-gray-700 font-semibold">Arrastra tus imágenes aquí</p>
                <p class="text-xs text-gray-500 mt-1">Soporta JPG, PNG y WebP (hasta 50 MB por archivo)</p>
            </div>
            <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp" class="hidden" />
        </div>

        <!-- Lista de archivos seleccionados -->
        <div id="file-list" class="mt-4 space-y-2 max-h-56 overflow-y-auto pr-1"></div>

        <!-- Panel de Opciones de Compresión (se muestra al elegir imágenes) -->
        <div id="options-panel" class="hidden mt-6 pt-5 border-t border-gray-100">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Opciones de Compresión</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Selector de Calidad -->
                <div>
                    <label for="quality-select" class="block text-xs font-medium text-gray-700 mb-1">Nivel de Calidad</label>
                    <select id="quality-select" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="90">Alta (90% - Fotografía)</option>
                        <option value="80" selected>Equilibrada (80% - Recomendada)</option>
                        <option value="50">Máxima (50% - Menor peso)</option>
                    </select>
                </div>

                <!-- Selector de Formato -->
                <div>
                    <label for="format-select" class="block text-xs font-medium text-gray-700 mb-1">Formato de Salida</label>
                    <select id="format-select" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="original" selected>Mantener original</option>
                        <option value="webp">Convertir todo a WebP (Moderno)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Botón de acción -->
        <button id="upload-btn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition-all hidden shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
            Comprimir y Descargar ZIP
        </button>

        <!-- Pie de página -->
        <div class="text-center mt-6">
            <span class="text-xs text-gray-400">Procesado local con Sharp & Node.js</span>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>

</html>
