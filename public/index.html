<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImgSnap</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">ImgSnap</h1>
        <p class="text-gray-600 text-center mb-6">Arrastra tus imágenes o selecciónalas para comprimirlas al instante.</p>

        <!-- Zona de Drag & Drop -->
        <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-indigo-500 transition-colors">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-gray-700 font-medium">Arrastra tus imágenes aquí</p>
            <p class="text-sm text-gray-500 mt-1">o haz clic para buscarlas en tu equipo</p>
            <input type="file" id="file-input" multiple accept="image/*" class="hidden"/>
        </div>

        <!-- Lista de archivos seleccionados -->
        <div id="file-list" class="mt-6 space-y-2 max-h-40 overflow-y-auto"></div>

         <!-- Botón de acción -->
        <button id="upload-btn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors hidden shadow-md">
            Comprimir y Descargar ZIP
        </button>

    </div>
    <script src="/js/main.js"></script>
  </body>

</html>
